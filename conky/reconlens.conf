--[[ ReconLens Conky panel.

  Shows a live ReconLens summary (outbound scan stats + inbound honeypot hits)
  on your desktop. It calls scripts/conky-status.sh, which reads the JSON API.

  Setup:
    1. Put conky-status.sh somewhere on the machine running Conky and make it
       executable:  chmod +x conky-status.sh
    2. Edit the two paths/URL below (SCRIPT path + RECONLENS_URL).
    3. Run:  conky -c reconlens.conf

  Requires: conky, curl, python3 on the desktop.
]]

conky.config = {
    alignment = 'top_right',
    gap_x = 24,
    gap_y = 48,
    minimum_width = 280,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 160,
    double_buffer = true,
    update_interval = 10.0,
    use_xft = true,
    font = 'monospace:size=10',
    default_color = 'D7DCE5',
    color1 = '4FD1C5',
    color2 = '7B869C',
};

conky.text = [[
${color1}${font monospace:bold:size=12}◈ ReconLens${font}${color}
${color2}${hr 1}${color}
${execi 15 RECONLENS_URL=http://RECONLENS-HOST:8077 /opt/reconlens/scripts/conky-status.sh}
]];
